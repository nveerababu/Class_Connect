<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'css/index.css' %}">
        <link rel="icon" type="image/png"  sizes="38x38" href="{% static 'images/logo.png' %}">

    <title>Document</title>
</head>
<body>
   
    <nav class="nav">
    <center>
    <img src="{% static 'images/logo.png' %}" alt="Logo" width="60">
    <br>
    <b>ClassConnect</b>
    </center>
     <ul class="menubar">
        <li><a href="/">Home</a></li> 
        <li><a href="/courses">Courses</a></li>
        <li><a href="/about">About</a></li>
        <li><a href="/contact"></i>ContactUs</a></li>  
        </ul>
        <ul class="profile">
        {% if user.is_authenticated %}
        <li><a href="#">Profile({{ user.username }})</a></li>
        <li><a href="/logout/"></i>Logout</a></li>
        {% else %}
        <li><a href="/accounts/login/"></i> LogIn</a></li>
         <li><a href="/signup/"></i>SignUp</a></li>
        {% endif %}  
    </ul>   

    </nav>
 {% block body_block %}
{% endblock %} 
</body>
</html>
