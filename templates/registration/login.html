{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
    <title>Login - ClassConnect</title>
</head>
<body>
{% if messages %}
            {% for message in messages %}
                <div style="background-color: #fee2e2; color: #b91c1c; padding: 10px; border-radius: 6px; margin-bottom: 15px; font-size: 13px; font-weight: bold; border: 1px solid #f87171; text-align: center;">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

    <img src="{% static 'images/stlogon.png' %}" alt="Logo" width="150">
  <div class="login">
        <!-- Error / Success Messages Box -->
        <h1>Welcome To The Login Page</h1>
        <form method="POST">
            {{ form.as_p }}
            {% csrf_token %}
            <input type="submit" value="Login">
        </form>
    </div>
</body>
</html>
