{% extends 'index.html' %}
{% load static %}

{% block body_block %}
<link rel="stylesheet" href="{% static 'css/contact.css' %}">

<div class="page-container">
    <div class="contact-card">
        <div class="contact-left">
            <h2>Contact Us</h2>
            <p class="subtitle">Have queries regarding student registration or portal access? Send a message.</p>

            <div class="contact-details">
                <p><strong>Email:</strong> support@studentportal.com</p>
                <p><strong>Phone:</strong> +91 98765 43210</p>
                <p><strong>Location:</strong> Main Campus, Admin Block</p>
            </div>
        </div>

        <div class="contact-right">
            <form method="POST">
                {% csrf_token %}
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" name="name" placeholder="Your name" required>
                </div>

                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" name="email" placeholder="Your email" required>
                </div>

                <div class="form-group">
                    <label>Message</label>
                    <textarea name="message" rows="4" placeholder="Write your message here..." required></textarea>
                </div>

                <button type="submit" class="btn-submit">Send Message</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
